# --- Build performance ---
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false

# --- Kotlin ---
kotlin.code.style=official

# --- P8: Dependency verification (supply-chain hardening) ---
# `strict` means a tampered or typosquatted artifact FAILS the build — but it
# also fails when gradle/verification-metadata.xml is absent. So verification is
# BOOTSTRAPPED before it is ENFORCED:
#   1. Phase 0  — run the `verify-deps` workflow (manual) to generate and commit
#                 gradle/verification-metadata.xml
#   2. Phase 10 — uncomment the two lines below, then re-run the generator
#                 whenever dependencies change:
#                     ./gradlew --write-verification-metadata sha256 help
# They stay commented for now so the first CI build can resolve dependencies
# and produce the baseline file in the first place.
# org.gradle.dependency.verification=strict
# org.gradle.dependency.verification.console=verbose