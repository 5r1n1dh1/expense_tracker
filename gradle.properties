# --- Build performance ---
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# org.gradle.configuration-cache is left OFF for now: AGP 9.3's
# ProcessNavigationXmlTask trips a configuration-cache serialisation error
# ("__runtimeDependenciesNavigationFiles__"). Revisit in Phase 10 once the app is
# complete; the Gradle build cache already provides most of the win.
org.gradle.configuration-cache=false

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.x built-in Kotlin is enabled by default. Removing the `kotlin-android`
# plugin (see build.gradle.kts) is what makes the project compile; this line is
# explicit documentation of intent.
android.builtInKotlin=true

# AGP 9 forbids the `kotlin.sourceSets` DSL under built-in Kotlin, but the KSP
# Gradle plugin (required by Room + Hilt) still registers its generated sources
# that way. AGP documents this exact flag as the supported escape hatch for
# third-party plugins that have not migrated yet.
android.disallowKotlinSourceSets=false

# --- Kotlin ---
kotlin.code.style=official

# --- P8: Dependency verification (supply-chain hardening) ---
# `strict` means a tampered or typosquatted artifact FAILS the build — but it
# also fails when gradle/verification-metadata.xml is absent. So verification is
# BOOTSTRAPPED before it is ENFORCED:
#   1. Phase 0  — run the `verify-deps` workflow (manual) to generate and commit
#                 gradle/verification-metadata.xml
#   2. Phase 10 — uncomment the two lines below, then re-run the generator
#                 whenever dependencies change:
#                     ./gradlew --write-verification-metadata sha256 help
# They stay commented for now so the first CI build can resolve dependencies
# and produce the baseline file in the first place.
# org.gradle.dependency.verification=strict
# org.gradle.dependency.verification.console=verbose