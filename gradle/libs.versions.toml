[versions]
# ---------------------------------------------------------------------------
# TOOLCHAIN — VERIFIED COMPATIBLE SET (do not bump one without the others)
#
# AGP 9.x has BUILT-IN Kotlin support, so there is no `kotlin-android` plugin.
# AGP bundles its own Kotlin compiler, and the bundled version is what actually
# compiles the code. Verified from the AGP 9.3.1 POM:
#
#   com.android.tools.build:gradle:9.3.1
#     -> kotlin-gradle-plugin = 2.2.10
#     -> symbol-processing-gradle-plugin = 2.2.10-2.0.2
#
# Therefore:
#   Kotlin        = 2.2.10   (must match AGP's bundled compiler)
#   KSP           = 2.2.10-2.0.2  (must match the Kotlin it runs on)
#   Compose/serial plugins = 2.2.10  (same Kotlin line)
#   Gradle        = 9.5.0   (AGP 9.3 minimum)
#   JDK           = 17      (AGP 9.x minimum)
#
# NOTE: we deliberately do NOT float to Kotlin 2.4.x. Newer KGP/KSP releases
# exist, but AGP's built-in compiler is pinned to 2.2.10, and the Compose and
# KSP plugins must agree with the bundled compiler. Verified against:
#   - developer.android.com/build/releases/agp-9-3-0-release-notes (Gradle 9.5, JDK 17)
#   - developer.android.com/build/migrate-to-built-in-kotlin (built-in Kotlin)
#   - dl.google.com AGP 9.3.1 POM (embedded Kotlin 2.2.10)
#
# Dependency verification (P8) pins every artifact's SHA-256.
# ---------------------------------------------------------------------------
agp = "9.3.1"
gradle = "9.5.0"
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"

# SDK
# compileSdk 37: current AndroidX (Compose 1.12.x, navigation 2.10.x,
#   hilt-navigation 1.4.0) requires compiling against API 37 — confirmed by the
#   AAR metadata check. AGP 9.3 supports up to API 37.
# targetSdk 36: Google Play requires API 36 for submissions since 31 Aug 2026.
#   compileSdk may exceed targetSdk; that is normal and correct.
#   (API 37 targeting becomes mandatory around Aug 2027 — revisit then.)
compileSdk = "37"
minSdk = "29"
targetSdk = "36"

# AndroidX / Compose
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
hiltNavigationCompose = "1.4.0"
profileinstaller = "1.4.1"

# DI
hilt = "2.60.1"

# Persistence
room = "2.8.5"
datastore = "1.2.1"

# Background work
work = "2.12.0"

# Sign-in
credentials = "1.6.0"
playServicesAuth = "22.0.0"

# Firebase (Spark plan — free, no billing account)
#
# BoM PINNED TO 34.19.0 deliberately. BoM 35.0.0 ships firebase-auth 25.0.0,
# which is compiled with Kotlin 2.4.0. EVERY AGP 9.x release bundles Kotlin
# 2.2.10 (verified from each AGP POM: 9.3.1, 9.4.0, 9.4.1 all -> kotlin 2.2.10),
# so a Kotlin-2.4-compiled dependency is unreadable by our compiler:
#   "Module was compiled with an incompatible version of Kotlin.
#    The binary version of its metadata is 2.4.0, expected version is 2.2.0."
# BoM 34.19.0 -> auth 24.2.0, firestore 26.6.0, common 23.0.0 — all compiled
# against Kotlin 2.1/2.2 and therefore readable by AGP's 2.2.10 compiler.
# Revisit when AGP bundles Kotlin >= 2.4.
firebaseBom = "34.19.0"
# The google-services plugin itself; must match the version of google-services.json in the repo.
googleServices = "4.5.0"

# Widget
glance = "1.2.0"

# Coroutines / serialization
coroutines = "1.11.0"
serializationJson = "1.12.0"

# Quality tooling
detekt = "1.23.8"

# Testing
junit4 = "4.13.2"
robolectric = "4.17"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
androidxTestCore = "1.7.0"
espressoCore = "3.7.0"
composeUiTest = "1.12.1"
hiltAndroidTesting = "2.60.1"
turbine = "1.2.1"
mockk = "1.14.11"

[libraries]
# --- AndroidX core ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }

# --- Compose ---
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-animation = { module = "androidx.compose.animation:animation" }

# --- Hilt ---
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hiltNavigationCompose" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hiltNavigationCompose" }

# --- Room ---
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# --- DataStore ---
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
protobuf-kotlin-lite = { module = "com.google.protobuf:protobuf-kotlin-lite", version = "4.33.0" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version = "4.33.0" }

# --- WorkManager ---
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# --- Sign-in (Credential Manager) ---
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "playServicesAuth" }

# --- Firebase (Spark / free tier) ---
# Firebase BOM manages versions for all of these.
# NOTE: recent Firebase SDKs (auth 25.x, firestore 27.x) MERGED the separate
# `-ktx` artifacts into the base artifacts — `firebase-auth-ktx` and
# `firebase-firestore-ktx` no longer exist; the base artifacts ship the Kotlin
# extensions themselves. Verified against firebase-bom 35.0.0's POM.
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
firebase-common = { module = "com.google.firebase:firebase-common" }
# NOTE: firebase-crashlytics / firebase-analytics / firebase-performance are
# DELIBERATELY ABSENT — decision P1: nothing leaves the device.

# --- Widget ---
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }

# --- Coroutines / serialization ---
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }

# --- Testing ---
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-monitor = { module = "androidx.test:monitor", version.ref = "androidxTestRunner" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "composeUiTest" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "composeUiTest" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hiltAndroidTesting" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotlinx-coroutines-debug = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-debug", version.ref = "coroutines" }

# --- Detekt ---
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# NOTE: there is deliberately NO `kotlin-android` plugin here.
# AGP 9.0+ has built-in Kotlin support, and applying org.jetbrains.kotlin.android
# on top of it is a hard error:
#   "The 'org.jetbrains.kotlin.android' plugin is no longer required for Kotlin
#    support since AGP 9.0."
# The Compose and Serialization compiler plugins are still separate and still required.
# See: developer.android.com/build/migrate-to-built-in-kotlin
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }