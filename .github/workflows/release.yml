name: Release

# D7: releases ship via GitHub Releases, not Play Store. Signed APK attached to a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # android-actions/setup-android omitted: it fails with "Failed to find
      # package 'tools'". The runner image ships a full SDK and the Android
      # Gradle plugin auto-provisions missing platform/build-tools components.

      - name: Verify P9 — no destructive migrations
        run: |
          if grep -rn "fallbackToDestructiveMigration" app/src/ ; then
            echo "::error::Destructive migration present — refusing to release."
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::add-mask::$KEYSTORE_PASS"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASS"

          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          # keystore.properties is gitignored — it only ever exists on this runner.
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/keystore.jks
          storePassword=$KEYSTORE_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF
          echo "keystore.properties written (gitignored)"

      - name: Build signed release
        run: ./gradlew clean assembleRelease bundleRelease --stacktrace

      - name: Rename release APK to expense_tracker.apk
        run: |
          chmod +x release/apk-rename.sh
          ./release/apk-rename.sh

      - name: Verify APK is signed
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/expense_tracker.apk
          test -f "$APK" || { echo "::error::expense_tracker.apk missing"; exit 1; }

          # The runner image ships multiple build-tools versions and the glob form
          # can resolve to a stub/broken wrapper in some images. Pick the newest
          # real apksigner we can execute, then verify.
          AUTH_APKSIGNER=
          for dir in "$ANDROID_HOME"/build-tools/*/; do
            candidate="${dir}apksigner"
            if [ -x "$candidate" ] && "$candidate" --help >/dev/null 2>&1; then
              AUTH_APKSIGNER="$candidate"
            fi
          done
          if [ -z "$AUTH_APKSIGNER" ]; then
            echo "::error::no usable apksigner found under \$ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using apksigner: $AUTH_APKSIGNER"
          "$AUTH_APKSIGNER" verify --print-certs "$APK"
          echo "Release APK signature verified."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: app/build/outputs/apk/release/expense_tracker.apk
          generate_release_notes: true

      # P10 (§18.8): publish the update manifest.
      #
      # NOT the GitHub API: this repo is PRIVATE, so an unauthenticated request to
      # /releases/latest returns 404 and the in-app updater would silently never find
      # an update. Firebase Hosting is free on the Spark plan (D2) and has no rate limit.
      #
      # Skipped automatically when FIREBASE_CLI_TOKEN is not configured, so a release
      # never fails just because hosting hasn't been set up yet.
      - name: Publish update manifest (P10)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
          VERSION_NAME: ${{ github.ref_name }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/expense_tracker.apk
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Firebase hosting not configured — skipping manifest publish."
            exit 0
          fi
          NOTES=$(git tag -l --format='%(contents)' "$VERSION_NAME" | head -60 || true)
          mkdir -p public
          jq -n \
            --arg vn "$VERSION_NAME" \
            --arg url "$RELEASE_URL" \
            --arg notes "$NOTES" \
            '{versionName:$vn, url:$url, notes:$notes, mandatory:false}' \
            > public/version.json
          cat public/version.json
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "${FIREBASE_HOSTING_PROJECT:-demo-kharch}" \
            --token "$FIREBASE_TOKEN"

      - name: Upload build provenance (P8)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: 'app/build/outputs/apk/release/expense_tracker.apk'

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apk-${{ github.ref_name }}
          retention-days: 90
          path: app/build/outputs/apk/release/expense_tracker.apk