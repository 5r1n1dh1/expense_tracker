name: Release

# D7: releases ship via GitHub Releases, not Play Store. Signed APK attached to a tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release # required reviewers before the keystore is usable

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Verify P9 — no destructive migrations
        run: |
          if grep -rn "fallbackToDestructiveMigration" app/src/ ; then
            echo "::error::Destructive migration present — refusing to release."
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::add-mask::$KEYSTORE_PASS"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASS"

          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          # keystore.properties is gitignored — it only ever exists on this runner.
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/keystore.jks
          storePassword=$KEYSTORE_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF
          echo "keystore.properties written (gitignored)"

      - name: Build signed release
        run: ./gradlew clean assembleRelease bundleRelease --stacktrace

      - name: Verify APK is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::release APK missing"; exit 1; }
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" || {
            echo "::error::APK signature verification FAILED"; exit 1; }
          echo "Release APK signature verified."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      # P10 (§18.8): publish the update manifest.
      #
      # NOT the GitHub API: this repo is PRIVATE, so an unauthenticated request to
      # /releases/latest returns 404 and the in-app updater would silently never find
      # an update. Firebase Hosting is free on the Spark plan (D2) and has no rate limit.
      #
      # Skipped automatically when FIREBASE_CLI_TOKEN is not configured, so a release
      # never fails just because hosting hasn't been set up yet.
      - name: Publish update manifest (P10)
        if: ${{ secrets.FIREBASE_CLI_TOKEN != '' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
          VERSION_NAME: ${{ github.ref_name }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.apk
        run: |
          set -euo pipefail
          NOTES=$(git tag -l --format='%(contents)' "$VERSION_NAME" | head -60 || true)
          mkdir -p public
          jq -n \
            --arg vn "$VERSION_NAME" \
            --arg url "$RELEASE_URL" \
            --arg notes "$NOTES" \
            '{versionName:$vn, url:$url, notes:$notes, mandatory:false}' \
            > public/version.json
          cat public/version.json
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "${FIREBASE_HOSTING_PROJECT:-demo-kharch}" \
            --token "$FIREBASE_TOKEN"

      - name: Upload build provenance (P8)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: 'app/build/outputs/apk/release/*.apk'

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apk-${{ github.ref_name }}
          retention-days: 90
          path: app/build/outputs/apk/release/*.apk