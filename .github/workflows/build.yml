name: Build & Unit Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# P8: least privilege. Only the release workflow needs write access.
permissions:
  contents: read

# CI is split into lint + test (parallel, fast log capture) then build
# (needs both). This matches AGENTS.md CI Lessons: do NOT chain all
# phases in one job — independent quality gates run concurrently so a
# failing unit test is visible in seconds, not after a 45-minute
# monolithic job. All Gradle runs happen here, never locally.

jobs:
  lint:
    name: Lint · Detekt · Guards
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Normalise trailing newlines
        run: ./scripts/ensure-trailing-newline.sh

      - name: "Detekt (banned APIs - Log calls, Modifier.blur)"
        run: ./gradlew detekt --stacktrace

      # P9 (§18.2): a destructive migration silently deletes a user's ledger.
      - name: No destructive Room migrations
        run: |
          if grep -rn "fallbackToDestructiveMigration" app/src/ ; then
            echo "::error file=app/src::Destructive Room migration found. A user's ledger would be silently deleted on upgrade. Write an explicit Migration + MigrationTestHelper test instead."
            exit 1
          fi
          echo "No destructive migrations found."

      # P1 (§18.1): nothing may leave the device except Firestore sync +
      # the optional user-initiated update check.
      - name: No telemetry dependencies (P1)
        run: |
          if grep -rnE '(module|alias)\s*=\s*"[^"]*firebase-(crashlytics|analytics|perf)|implementation\(libs\.[a-z.]*(crashlytics|analytics|perf)' \
               gradle/libs.versions.toml app/build.gradle.kts ; then
            echo "::error::Telemetry dependency present. Decision P1 forbids crash/analytics/performance collection."
            exit 1
          fi
          echo "No telemetry dependencies found."

      - name: Upload lint & detekt reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-lint-${{ github.sha }}
          retention-days: 14
          path: |
            app/build/reports/lint-results*.html
            app/build/reports/detekt/**

  test:
    name: Unit test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-test-${{ github.sha }}
          retention-days: 14
          path: app/build/reports/tests/**

  build:
    name: Build APKs
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apks-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: app/build/outputs/apk/**/*.apk

      # NOTE on the 8192 -> 10240 KB budget bump (v1.1.1):
      # AGP now packages classes.dex UNCOMPRESSED (aligned for 16 KB pages),
      # which is what Android 15+/16 devices require for mmap'd code. That
      # makes ~7.6 MB of dex unavoidable, so the APK's floor is ~8 MB and a
      # compressed-dex APK is simply not available anymore. The 8192 KB
      # budget measured the old packaging, not the app's actual size.
      - name: APK size gate
        run: |
          set -euo pipefail
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          DEBUG_KB=$(( $(stat -c%s "$DEBUG_APK") / 1024 ))
          RELEASE_KB=$(( $(stat -c%s "$RELEASE_APK") / 1024 ))
          echo "debug:   ${DEBUG_KB} KB   ($DEBUG_APK)"
          echo "release: ${RELEASE_KB} KB   ($RELEASE_APK)"
          ls -la "$DEBUG_APK" "$RELEASE_APK"
          echo "---- largest entries in release APK (uncompressed) ----"
          python3 - "$RELEASE_APK" << 'PYEOF'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          total = 0
          rows = []
          for info in z.infolist():
              if info.is_dir():
                  continue
              rows.append((info.file_size, info.filename))
              total += info.file_size
          rows.sort(reverse=True)
          for size, name in rows[:25]:
              print(f"{size / 1024:10.1f} KB  {name}")
          print(f"TOTAL uncompressed: {total / 1024:.1f} KB across {len(rows)} entries")
          PYEOF
          if [ "$RELEASE_KB" -gt 10240 ]; then
            echo "::error::Release APK is ${RELEASE_KB} KB, over the 10240 KB budget"
            exit 1
          fi
          echo "Release APK within budget."

      - name: Upload mapping (release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mapping-${{ github.sha }}
          retention-days: 14
          path: app/build/outputs/mapping/**
