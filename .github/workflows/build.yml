name: Build & Unit Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# P8: least privilege. Only the release workflow needs write access.
permissions:
  contents: read

jobs:
  build:
    name: Compile · Unit test · Lint · Detekt
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Detekt (banned APIs: Log.* of user data, Modifier.blur)
        run: ./gradlew detekt --stacktrace

      # P9 (§18.2): a destructive migration silently deletes a user's ledger.
      # This is the single highest-severity guard in the repo.
      - name: No destructive Room migrations
        run: |
          if grep -rn "fallbackToDestructiveMigration" app/src/ ; then
            echo "::error file=app/src::Destructive Room migration found. A user's ledger would be silently deleted on upgrade. Write an explicit Migration + MigrationTestHelper test instead."
            exit 1
          fi
          echo "No destructive migrations found."

      # P1 (§18.1): nothing may leave the device except Firestore sync + the
      # optional user-initiated update check.
      - name: No telemetry dependencies (P1)
        run: |
          if grep -rn "firebase-crashlytics\|firebase-analytics\|firebase-perf" gradle/libs.versions.toml app/build.gradle.kts ; then
            echo "::error::Telemetry dependency present. Decision P1 forbids crash/analytics/performance collection."
            exit 1
          fi
          echo "No telemetry dependencies found."

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: APK size gate
        run: |
          DEBUG_SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
          echo "debug APK: $((DEBUG_SIZE/1024)) KB (budget 13312 KB)"
          [ "$DEBUG_SIZE" -lt $((13*1024*1024)) ] || { echo "::error::Debug APK exceeds size budget"; exit 1; }

      # Upload only — never downloaded locally (C2). Inspect with:
      #   gh run view <id>
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apks-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: app/build/outputs/apk/**/*.apk

      - name: Upload test & analysis reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-${{ github.sha }}
          retention-days: 14
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results*.html
            app/build/reports/detekt/**
            app/build/outputs/mapping/**