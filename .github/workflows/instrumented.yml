name: Instrumented Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # nightly sweep on main

permissions:
  contents: read

jobs:
  emulator-tests:
    name: Instrumented (API ${{ matrix.api-level }})
    strategy:
      fail-fast: false
      matrix:
        # No `profile:` — the valid AVD hardware-profile ids differ between emulator
        # images and a wrong name fails the whole job ("No device found matching
        # --device ..."). Letting the action pick the default is robust across images.
        #
        # NOTE: every matrix value must be an array (or an `include:` mapping). A bare
        # scalar such as `target: google_apis` is rejected at parse time with
        # "Unexpected value 'google_apis'", which fails the whole run with zero jobs.
        # API 34/35/36 are the stable, downloadable x86_64 system images.
        # API 37 is still preview-only (no x86_64 image published), so including it
        # fails at AVD creation with "Connection refused" on port 5554. Add it once
        # the stable image ships; compileSdk 37 is still what we compile against.
        api-level: [34, 35, 36]
        target: [google_apis]
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # android-actions/setup-android omitted: it fails with "Failed to find
      # package 'tools'". The runner image ships a full SDK and the Android
      # Gradle plugin auto-provisions missing platform/build-tools components.

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator runner shells out to adb, but nothing starts the adb server
      # first once setup-android is out of the pipeline ("Unable to connect to
      # adb daemon on port: 5037"). Start it explicitly before booting the AVD.
      - name: Start adb server
        run: |
          # adb is not on PATH by default on the runner image (exit 127 = command
          # not found). It lives in the SDK's platform-tools directory.
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          ADB="$ANDROID_HOME/platform-tools/adb"
          test -x "$ADB" || ADB="$HOME/Android/Sdk/platform-tools/adb"
          echo "Using adb: $ADB"
          "$ADB" start-server
          "$ADB" version

      # Animations stay ON: the glass transitions and spring motion are part of
      # what we are testing (§7.4). disable-animations:true would defeat the point.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instrumented-results-api${{ matrix.api-level }}-${{ github.sha }}
          retention-days: 14
          path: app/build/reports/androidTests/**